[project]
name = "jarvis"
version = "0.2.0"
description = "Lokaler JARVIS-Assistent: PC, WLED, ESPHome-Sensoren und Skripte per Web-UI und lokalem LLM"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "anyio>=4.15.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: langsamer Ende-zu-Ende-Test (Installer mit echtem Server); abwählen mit -m \"not slow\""]
filterwarnings = ["ignore::DeprecationWarning"]
